[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "braco-repro"
version = "0.1.0"
description = "Official implementation of Braco: Beyond Selection, NeurIPS 2026 Spotlight"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "entmax==1.3",
  "torch==2.1.2",
]

[project.urls]
Homepage = "https://github.com/zrrraa/Braco"
Repository = "https://github.com/zrrraa/Braco"
Issues = "https://github.com/zrrraa/Braco/issues"

[project.optional-dependencies]
dev = [
  "pytest==8.2.2",
  "pyyaml==6.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
